<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joshua-Liam Kiesch</title>
  <meta name="description" content="Alle Links von Joshua-Liam Kiesch an einem Ort.">
  <link rel="canonical" href="https://www.joshs-leben.de/links">
  <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c161b" media="(prefers-color-scheme: dark)">
  <script>
    // GitHub bleibt als Einstieg erhalten; beide Ansichten verwenden dieselbe Domain.
    (() => {
      const validTheme = value => value === 'light' || value === 'dark';
      if (location.hostname === 'joshslebenmitsma.github.io') {
        const target = new URL('https://www.joshs-leben.de/links');
        target.search = location.search;
        target.hash = location.hash;
        try {
          const previousTheme = localStorage.getItem('joshs-theme') ?? localStorage.getItem('josh-linktree-theme');
          if (validTheme(previousTheme)) target.searchParams.set('themeFallback', previousTheme);
        } catch { /* Die Weiterleitung funktioniert auch ohne lokalen Speicher. */ }
        location.replace(target.href);
        return;
      }

      // Eine bisherige Linktree-Auswahl nur übernehmen, wenn noch keine gemeinsame besteht.
      const url = new URL(location.href);
      let theme = null;
      try { theme = localStorage.getItem('joshs-theme'); } catch {}
      if (!validTheme(theme)) {
        theme = url.searchParams.get('themeFallback');
        if (!validTheme(theme)) {
          try { theme = localStorage.getItem('josh-linktree-theme'); } catch {}
        }
        if (validTheme(theme)) {
          try { localStorage.setItem('joshs-theme', theme); } catch {}
        }
      }
      if (validTheme(theme)) {
        document.documentElement.dataset.theme = theme;
        document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
          meta.content = theme === 'dark' ? '#0c161b' : '#f6f1e9';
        });
      }
      // Den einmaligen Übertragungswert aus der sichtbaren Adresse entfernen.
      if (url.searchParams.has('themeFallback')) {
        url.searchParams.delete('themeFallback');
        try { history.replaceState(history.state, '', url.href); } catch {}
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1e9;
      --text: #16323a;
      --muted: #596e70;
      --card: #fffdf8;
      --border: #d8d2c6;
      --accent: #164d50;
      --accent-text: #ffffff;
      --soft: #e5eee9;
      --focus: #b94f38;
      --shadow: 2px 3px 0 #d9d1c4;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #0c161b;
        --text: #eef6f5;
        --muted: #bdd0d2;
        --card: #14252b;
        --border: #35515a;
        --accent: #68d0c5;
        --accent-text: #09201f;
        --soft: #1b3739;
        --focus: #ff9a7d;
        --shadow: 2px 3px 0 #243c41;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0c161b;
      --text: #eef6f5;
      --muted: #bdd0d2;
      --card: #14252b;
      --border: #35515a;
      --accent: #68d0c5;
      --accent-text: #09201f;
      --soft: #1b3739;
      --focus: #ff9a7d;
      --shadow: 2px 3px 0 #243c41;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    main { width: 100%; max-width: 420px; text-align: center; }

    .theme-tools { display: flex; justify-content: flex-end; margin-bottom: 24px; }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      font: 600 .875rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
      touch-action: manipulation;
    }
    .theme-toggle[hidden] { display: none; }
    .theme-toggle:hover { border-color: var(--accent); }
    .theme-toggle-track {
      position: relative;
      flex: none;
      width: 48px;
      height: 28px;
      border: 2px solid var(--accent);
      border-radius: 99px;
      background: var(--card);
    }
    .theme-toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      transition: transform .15s ease;
    }
    .theme-toggle[aria-checked="true"] .theme-toggle-track { background: var(--accent); }
    .theme-toggle[aria-checked="true"] .theme-toggle-thumb { background: var(--accent-text); transform: translateX(20px); }

    .avatar {
      width: 132px;
      height: 132px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--soft);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: .02em;
      overflow: hidden;
      border: 4px solid var(--card);
      box-shadow: var(--shadow);
    }
    .avatar > * { grid-area: 1 / 1; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; transform: scale(1.2) translateY(-10px); }

    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.8rem; line-height: 1.2; font-weight: 700; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .tagline { margin-top: 6px; color: var(--muted); font-size: 1rem; }

    .links { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 60px;
      padding: 16px 18px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      color: var(--text);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      touch-action: manipulation;
      transition: transform .15s ease, border-color .15s ease, background-color .15s ease;
    }
    .link:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--soft); }
    .link:focus-visible, .theme-toggle:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .link:active { transform: translateY(0); }

    .link svg { width: 24px; height: 24px; flex: none; }
    .link span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .link .chevron { width: 18px; height: 18px; }

    .link.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      margin-top: 8px;
    }
    .link.primary:hover { background: var(--accent); }

    footer { margin-top: 36px; color: var(--muted); font-size: .8rem; }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
      .theme-toggle-thumb { transition: none; }
      .link:hover, .link:active { transform: none; }
    }
  </style>
</head>
<body>

        <span>Dunkler Modus</span>

      </button>

    <footer>&copy; Joshua-Liam Kiesch</footer>
  </main>
  <script>
    (() => {
      const storageKey = 'joshs-theme';
      const root = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      let preference = root.dataset.theme === 'light' || root.dataset.theme === 'dark'
        ? root.dataset.theme : null;

      const applyTheme = theme => {
        root.dataset.theme = theme;
        toggle.setAttribute('aria-checked', String(theme === 'dark'));
        document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
          meta.content = theme === 'dark' ? '#0c161b' : '#f6f1e9';
        });
      };

      applyTheme(preference ?? (systemTheme.matches ? 'dark' : 'light'));
      toggle.addEventListener('click', () => {
        preference = root.dataset.theme === 'dark' ? 'light' : 'dark';
        applyTheme(preference);
        try { localStorage.setItem(storageKey, preference); }
        catch { /* Der Schalter funktioniert auch ohne lokalen Speicher. */ }
      });
      toggle.hidden = false;

      systemTheme.addEventListener('change', event => {
        if (preference === null) applyTheme(event.matches ? 'dark' : 'light');
      });
      window.addEventListener('storage', event => {
        if (event.key !== storageKey && event.key !== null) return;
        preference = event.newValue === 'light' || event.newValue === 'dark' ? event.newValue : null;
        applyTheme(preference ?? (systemTheme.matches ? 'dark' : 'light'));
      });
    })();
  </script>
</body>
