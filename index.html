  <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c161b" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1e9;
      --text: #16323a;
      --muted: #596e70;
      --card: #fffdf8;
      --border: #d8d2c6;
      --accent: #164d50;
      --accent-text: #ffffff;
      --soft: #e5eee9;
      --focus: #b94f38;
      --shadow: 2px 3px 0 #d9d1c4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0c161b;
        --text: #eef6f5;
        --muted: #bdd0d2;
        --card: #14252b;
        --border: #35515a;
        --accent: #68d0c5;
        --accent-text: #09201f;
        --soft: #1b3739;
        --focus: #ff9a7d;
        --shadow: 2px 3px 0 #243c41;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    main { width: 100%; max-width: 420px; text-align: center; }

    .avatar {
      width: 132px;
      height: 132px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--soft);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: .02em;
      overflow: hidden;
      border: 4px solid var(--card);
      box-shadow: var(--shadow);
    }
    .avatar > * { grid-area: 1 / 1; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; transform: scale(1.2) translateY(-10px); }

    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.8rem; line-height: 1.2; font-weight: 700; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .tagline { margin-top: 6px; color: var(--muted); font-size: 1rem; }

    .links { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 60px;
      padding: 16px 18px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      color: var(--text);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      touch-action: manipulation;
      transition: transform .15s ease, border-color .15s ease, background-color .15s ease;
    }
    .link:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--soft); }
    .link:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .link:active { transform: translateY(0); }

    .link svg { width: 24px; height: 24px; flex: none; }
    .link span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .link .chevron { width: 18px; height: 18px; }

    .link.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      margin-top: 8px;
    }
    .link.primary:hover { background: var(--accent); }

    footer { margin-top: 36px; color: var(--muted); font-size: .8rem; }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
      .link:hover, .link:active { transform: none; }
    }
  </style>
</head>
